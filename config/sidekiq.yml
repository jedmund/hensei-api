:queues:
  - default
  - downloads
  - maintenance

:scheduler:
  :schedule:
    party_difficulty_sweep:
      cron: "0 4 * * *" # Daily at 04:00 UTC
      class: PartyDifficulty::SweepJob
      queue: maintenance
    extension_auth_code_cleanup:
      cron: "15 4 * * *" # Daily at 04:15 UTC
      class: ExtensionAuthCodes::CleanupJob
      queue: maintenance
    account_deletion_purge:
      cron: "30 4 * * *" # Daily at 04:30 UTC
      class: AccountDeletion::PurgeJob
      queue: maintenance
