:queues:
  - default
  - downloads
  - simulations
  - maintenance

:scheduler:
  :schedule:
    party_difficulty_sweep:
      cron: "0 4 * * *" # Daily at 04:00 UTC
      class: PartyDifficulty::SweepJob
      queue: maintenance
    party_participation_sweep:
      cron: "45 4 * * *" # Daily at 04:45 UTC
      class: PartyParticipation::SweepJob
      queue: maintenance
    party_view_flush:
      cron: "*/10 * * * *" # Every 10 minutes
      class: PartyViews::FlushJob
      queue: maintenance
    extension_auth_code_cleanup:
      cron: "15 4 * * *" # Daily at 04:15 UTC
      class: ExtensionAuthCodes::CleanupJob
      queue: maintenance
    account_deletion_purge:
      cron: "30 4 * * *" # Daily at 04:30 UTC
      class: AccountDeletion::PurgeJob
      queue: maintenance
    notification_cleanup:
      cron: "20 4 * * *" # Daily at 04:20 UTC
      class: Notifications::CleanupJob
      queue: maintenance
    gacha_exchange_rate:
      cron: "0 17 * * *"
      class: GachaSimulation::ExchangeRateJob
      queue: maintenance
    summon_stale_pages:
      cron: "0 5 * * 1" # Mondays at 05:00 UTC: refetch summon pages older than the wiki
      class: SummonAuras::RefreshStalePagesJob
      queue: maintenance
