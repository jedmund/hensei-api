inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'db/**/*'
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'config/**/*'
    - 'Gemfile'

# --- Layout ---
Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned

Layout/LineLength:
  Max: 150
  AllowedPatterns:
    - '^\s*#'

# --- Metrics ---
Metrics/MethodLength:
  Max: 30
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/ModuleLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Max: 80
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'
    - 'lib/tasks/**/*'

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

# Keyword arguments name themselves, so only positional ones count
Metrics/ParameterLists:
  CountKeywordArgs: false

# --- Style ---
Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/NumericLiterals:
  Enabled: false

# Many boolean-returning methods here are commands that report success
# (sync_to_collection!, persist, handle_fetch_success), not predicates;
# renaming them with `?` would misdescribe them.
Naming/PredicateMethod:
  AllowBangMethods: true
  AllowedMethods:
    - call
    - invalid_format
    - parse_boolean
    - to_boolean
    - backfill_family
    - handle_fetch_success
    - persist
    - validate_data
    - update_mention_for_entity

# --- Rails ---
# Specs set up state with update_column and friends on purpose
Rails/SkipsModelValidations:
  Exclude:
    - 'spec/**/*'

# --- RSpec ---
# A request spec checks the status, the body and the database, so several
# expectations and helpers per example are normal here
RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ExampleLength:
  Max: 25
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

RSpec/NestedGroups:
  Max: 5

# rails_helper doesn't call infer_spec_type_from_file_location!, so the
# `type:` metadata this cop calls redundant is what sets the spec type
RSpecRails/InferredSpecType:
  Enabled: false
