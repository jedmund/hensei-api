inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'db/**/*'
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'config/**/*'
    - 'Gemfile'

# --- Layout ---
Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned

Layout/LineLength:
  Max: 150
  AllowedPatterns:
    - '^\s*#'

# --- Metrics ---
Metrics/MethodLength:
  Max: 30
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 200
  Exclude:
    - 'spec/**/*'

Metrics/ModuleLength:
  Max: 200
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Max: 80
  Exclude:
    - 'spec/**/*'
    - 'lib/tasks/**/*'

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

# --- Security ---
Security/Eval:
  Enabled: true

Security/Open:
  Enabled: true

Security/YAMLLoad:
  Enabled: true

Security/JSONLoad:
  Enabled: true

Security/MarshalLoad:
  Enabled: true

# --- Style ---
Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: never

Style/NumericLiterals:
  Enabled: false

# Many boolean-returning methods here are commands that report success
# (sync_to_collection!, persist, handle_fetch_success), not predicates;
# renaming them with `?` would misdescribe them.
Naming/PredicateMethod:
  AllowBangMethods: true
  AllowedMethods:
    - call
    - compact_character_positions
    - invalid_format
    - parse_boolean
    - to_boolean
    - backfill_family
    - handle_fetch_success
    - persist
    - validate_data
    - update_mention_for_entity
