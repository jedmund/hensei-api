inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'db/**/*'
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'config/**/*'
    - 'Gemfile'

# --- Layout ---
Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned

Layout/LineLength:
  Max: 150
  AllowedPatterns:
    - '^\s*#'

# --- Metrics ---
Metrics/MethodLength:
  Max: 30
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/ModuleLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Max: 80
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'
    - 'lib/tasks/**/*'

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

# Keyword arguments name themselves, so only positional ones count
Metrics/ParameterLists:
  CountKeywordArgs: false

# --- Style ---
Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/NumericLiterals:
  Enabled: false

# Many boolean-returning methods here are commands that report success
# (sync_to_collection!, persist, handle_fetch_success), not predicates;
# renaming them with `?` would misdescribe them.
Naming/PredicateMethod:
  AllowBangMethods: true
  AllowedMethods:
    - call
    - invalid_format
    - parse_boolean
    - to_boolean
    - backfill_family
    - handle_fetch_success
    - persist
    - validate_data
    - update_mention_for_entity

# --- Rails ---
# A standalone cron script: plain Ruby with no gems and no Rails, so
# Time.zone, index_with and friends don't exist there.
Rails:
  Exclude:
    - 'script/fetch_gacha_rates.rb'

# Bulk relation writes (update_all, insert_all, upsert_all, touch_all) exist to
# change many rows in one statement without loading models, so skipping
# callbacks there is always deliberate. The cop still flags single-record skips
# (update_column(s), update_attribute, touch, toggle!, counters), where
# bypassing a validation or callback by accident is the real risk.
# Specs set up state with update_column and friends on purpose, and rake
# tasks are one-off backfills that skip callbacks on purpose.
Rails/SkipsModelValidations:
  ForbiddenMethods:
    - decrement!
    - decrement_counter
    - increment!
    - increment_counter
    - insert
    - insert!
    - toggle!
    - touch
    - update_attribute
    - update_column
    - update_columns
    - update_counters
    - upsert
  Exclude:
    - 'spec/**/*'
    - 'lib/tasks/**/*'

# The API returns English messages by design and the clients localize them;
# the account mailers are English-only too. Moving these strings into
# config/locales would add indirection without a second locale to serve.
Rails/I18nLocaleTexts:
  Enabled: false

# These are hand-written finders (several id formats or a name lookup), not
# dynamic attribute finders; find_by(route_id:) and friends would break them.
Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_sql
    - find_by_token_for
    - find_by_game_name
    - find_by_game_skill_id
    - find_by_route_id

# The post-deployment tools are the console UI of `rake deploy:post_deployment`
# and `rake granblue:import_data`; they print progress to the terminal on
# purpose. (Rake files themselves aren't checked: the cop only reads *.rb.)
Rails/Output:
  Exclude:
    - 'lib/logging_helper.rb'
    - 'lib/post_deployment/**/*'

# --- RSpec ---
# A request spec checks the status, the body and the database, so several
# expectations and helpers per example are normal here
RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ExampleLength:
  Max: 25
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

RSpec/NestedGroups:
  Max: 5

# rails_helper doesn't call infer_spec_type_from_file_location!, so the
# `type:` metadata this cop calls redundant is what sets the spec type
RSpecRails/InferredSpecType:
  Enabled: false

# "as an editor" names who makes a request and "for a style row" what a
# spec covers, which read better than forcing a "when"
RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
    - as
    - for

# Shared contexts define let! records that the including specs reference,
# which this cop can't see from the support file
RSpec/LetSetup:
  Exclude:
    - 'spec/support/**/*'

# Cross-cutting specs (golden snapshots, data integrity, rake tasks, config
# files) describe a behavior, not one class
RSpec/DescribeClass:
  Enabled: false

# Data migration specs stub the migration's own `say` output (and check it)
RSpec/SubjectStub:
  Exclude:
    - 'spec/data/**/*'
