# Hand-maintained input to `bin/rails wonders:generate_seed`, which rebuilds
# catalogue.json from the gbf.wiki Wonders page and the game captures.
#
# ids: game ids for wiki Wonders no capture has, by their wiki name. The
#   generator fails when a wiki Wonder has neither a capture nor an id here.
#
# wonders: fills or corrects fields per granblue_id. A blank (~) value
#   changes nothing, so the placeholders below are safe to leave empty.
#   Wonder fields: name_en, name_jp, description_en, description_jp,
#   element, battle_relevant.
#   effects: by position (1, 2, …): action_id, text_en, text_jp, details.
#   Values here win over the captures and the wiki. Text inferred rather
#   than seen in the game goes under `derived:` (same fields): derived
#   values only fill blanks, so real capture text replaces them as soon as
#   a capture has it.
#   Once a capture includes one of these Wonders, its game text and
#   action_ids come in on their own; drop entries the game text makes
#   unnecessary.

ids:
  # Rings: matched by identical image bytes on the wiki and the game CDN
  Ring of Justice: "2001"
  Ring of The Hanged Man: "2002"
  Ring of Temperance: "2004"
  Ring of The Devil: "2005"
  # From the wiki image names (wonder9001.jpg, wonder9004.jpg)
  Thief's Map: "9001"
  Premium FRIED SHRIMP: "9004"

wonders:
  "2001":
    description_jp: ~
    effects:
      1:
        text_en: "Gives a 30% boost to water allies' HP."
        action_id: ~
    # JA name and effect follow the captured Rings (Ring of Death,
    # Ring of The Hanged Man); the flavor text can't be derived.
    derived:
      name_jp: "リング・オブ・ジャスティス"
      effects:
        1:
          text_jp: "水属性キャラのHPが30％UPする。"
  "2002":
    name_jp: ~
    description_jp: ~
    effects:
      1:
        text_en: "Amplifies earth allies' DMG against water foes by 10%."
        text_jp: ~
        action_id: ~
  "2004":
    description_jp: ~
    effects:
      1:
        text_en: "Gives a 30% boost to wind allies' HP."
        action_id: ~
    # JA name and effect follow the captured Rings (Ring of Death,
    # Ring of The Hanged Man); the flavor text can't be derived.
    derived:
      name_jp: "リング・オブ・テンパランス"
      effects:
        1:
          text_jp: "風属性キャラのHPが30％UPする。"
  "2005":
    # JA text and the action_id come from a capture; EN from the wiki
    effects:
      1:
        text_en: "Gives a 30% boost to fire allies' HP."
  "9001":
    name_jp: ~
    description_jp: ~
    effects:
      1:
        text_en: "Gives a 1% boost to upgrade grand success rate."
        text_jp: ~
        action_id: ~
  "9004":
    # JA text and the action_id come from a capture; EN from the wiki
    effects:
      1:
        text_en: "Gives a 1% boost to EXP earned on Fridays, Saturdays, and Sundays (JST)."
        text_jp: ~
        action_id: ~
